name: tests
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: weirs
          POSTGRES_PASSWORD: weirs_pw
          POSTGRES_DB: weirs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weirs -d weirs_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://weirs:weirs_pw@localhost:5432/weirs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
